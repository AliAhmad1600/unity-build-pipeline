name: Unity Build and Upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repo with private submodule authentication
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          submodules: true
          persist-credentials: true

      - name: Run Unity Build
        shell: cmd
        run: |
          call C:\Users\Aaron\Desktop\Builds\TestBuildAndroid.bat

      - name: Upload build to Google Drive
        shell: cmd
        env:
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          REM Replace the path below with your local build output folder
          set BUILD_PATH=C:\Users\Aaron\Desktop\Builds\Builds
          REM Upload to your Google Drive folder
          C:\rclone\rclone.exe copy "%BUILD_PATH%" gdrive:/ --drive-root-folder-id 1bI--U7S70jspBkr7cgY8IBMkFAZqzkoM --progress
