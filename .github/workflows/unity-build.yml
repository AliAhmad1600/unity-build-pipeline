name: Unity Build and Upload

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to checkout and build'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # Set branch environment variable from input
      - name: Set branch environment variable
        run: echo "SELECTED_BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV

      # Slack notification before any process
      - name: Slack Notification - Workflow Starting
        shell: powershell
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          $payload = (@{
            text = "Unity Build workflow is starting.`n*Workflow:* $env:GITHUB_WORKFLOW`n*Branch:* $env:SELECTED_BRANCH"
          }) | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK -Method Post -Body $payload -ContentType 'application/json'

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          submodules: true
          persist-credentials: true

      # Slack notification before build
      - name: Slack Notification - Build Starting
        shell: powershell
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          $payload = (@{
            text = "Unity Build process is starting.`n*Workflow:* $env:GITHUB_WORKFLOW`n*Branch:* $env:SELECTED_BRANCH"
          }) | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK -Method Post -Body $payload -ContentType 'application/json'

      # Run Unity Build
      - name: Run Unity Build
        shell: cmd
        run: call "C:\Users\Aaron\Desktop\Builds\TestBuildAndroid.bat"

      # Upload build to Google Drive
      - name: Upload Build to Google Drive
        shell: cmd
        env:
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: 'C:\rclone\rclone.exe copy "C:\Users\Aaron\Desktop\Builds\Builds" gdrive:/ --drive-root-folder-id 1bI--U7S70jspBkr7cgY8IBMkFAZqzkoM --progress'

      # Slack notification after build success or failure
      - name: Slack Notification - Build Result
        if: always()
        shell: powershell
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $text = if ($env:JOB_STATUS -eq "success") { "Build & Upload SUCCESS" } else { "Build OR Upload FAILED" }
          $googleDriveUrl = "https://drive.google.com/drive/folders/1bI--U7S70jspBkr7cgY8IBMkFAZqzkoM"
          $payload = (@{
            text = "$text`n*Workflow:* $env:GITHUB_WORKFLOW`n*Result:* $env:JOB_STATUS`n*Branch:* $env:SELECTED_BRANCH`n*Google Drive Folder:* <$googleDriveUrl|Open Build Folder>`n<https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID|View Full Log on GitHub>"
          }) | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK -Method Post -Body $payload -ContentType 'application/json'
