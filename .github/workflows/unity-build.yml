name: Unity Build and Upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # Slack notification: Build process starting
      - name: Slack Notification Build Process Starting
        shell: powershell
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          $payload = @{
            text = "🚀 Build process is starting...
*Workflow:* $env:GITHUB_WORKFLOW
*Branch:* $env:GITHUB_REF_NAME"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK -Method Post -Body $payload -ContentType 'application/json'

      # Checkout repository
      - name: Checkout repo with private submodule authentication
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          submodules: true
          persist-credentials: true

      # Slack notification: Unity build starting
      - name: Slack Notification Unity Build Starting
        shell: powershell
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          $payload = @{
            text = "🏗️ Unity build is starting...
*Workflow:* $env:GITHUB_WORKFLOW
*Branch:* $env:GITHUB_REF_NAME"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK -Method Post -Body $payload -ContentType 'application/json'

      # Run Unity Build
      - name: Run Unity Build
        shell: cmd
        run: call "C:\Users\Aaron\Desktop\Builds\TestBuildAndroid.bat"

      # Upload build to Google Drive
      - name: Upload build to Google Drive
        shell: cmd
        env:
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: 'C:\rclone\rclone.exe copy "C:\Users\Aaron\Desktop\Builds\Builds" gdrive:/ --drive-root-folder-id 1bI--U7S70jspBkr7cgY8IBMkFAZqzkoM --progress'

      # Slack notification (success or failure)
      - name: Slack Notification
        if: always()
        shell: powershell
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $emoji = if ($env:JOB_STATUS -eq "success") { "✅" } else { "❌" }
          $text = if ($env:JOB_STATUS -eq "success") { "BUILD & UPLOAD SUCCESS" } else { "BUILD OR UPLOAD FAILED" }
          $payload = @{
            text = "$emoji $text
*Workflow:* $env:GITHUB_WORKFLOW
*Result:* $env:JOB_STATUS
*Branch:* $env:GITHUB_REF_NAME
<https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID|View Full Log on GitHub>"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK -Method Post -Body $payload -ContentType 'application/json'
